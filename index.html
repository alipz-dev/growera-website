<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d19"><meta name="description" content="Sign in to GROWERA Crystal Era">
<title>Sign In | GROWERA Crystal Era</title>

<script>
(function(){
    try {
        var token = localStorage.getItem("growera_session_token") || sessionStorage.getItem("growera_session_token");
        if (token) { window.location.replace("/profile.html"); }
    } catch(e) {}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>

<main class="app-shell">

<section class="login-view" id="loginView" aria-labelledby="loginTitle">
    <div class="login-brand">
        <div class="brand-gem">
            <img src="assets/itemimage/112.png" alt="" width="22" height="22" style="image-rendering:pixelated">
        </div>
        <div>
            <span class="brand-name">GROWERA</span>
            <span class="brand-subtitle">CRYSTAL ERA</span>
        </div>
    </div>

    <div class="login-card glass">
        <div class="eyebrow"><span class="eyebrow-line"></span> PLAYER PORTAL</div>
        <h1 id="loginTitle">Enter the<br><span>Crystal Era.</span></h1>
        <p class="muted intro">Your adventure continues here. Sign in to preview your player profile.</p>

        <!-- Continue As -->
        <div class="continue-as-wrap" id="continueAsWrap" hidden>
            <div class="continue-as-label">CONTINUE AS</div>
            <button type="button" class="continue-as-btn" id="continueAsBtn" aria-label="Continue as last username">
                <div class="continue-as-avatar" id="continueAsAvatar">S</div>
                <div class="continue-as-info">
                    <strong id="continueAsUsername">@username</strong>
                    <span>Tap to fill username</span>
                </div>
                <span class="continue-as-arrow">→</span>
            </button>
            <div class="continue-as-divider">OR</div>
        </div>

        <form id="loginForm" novalidate>
            <label for="username">USERNAME</label>
            <div class="input-wrap">
                <span class="input-icon"><img src="assets/itemimage/980.png" alt="" width="16" height="16" style="image-rendering:pixelated"></span>
                <input id="username" name="username" autocomplete="username" placeholder="Enter your username" required maxlength="64" spellcheck="false" autocapitalize="off">
            </div>

            <label for="password">PASSWORD</label>
            <div class="input-wrap">
                <span class="input-icon"><img src="assets/itemimage/202.png" alt="" width="16" height="16" style="image-rendering:pixelated"></span>
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required maxlength="256">
                <button class="password-toggle" id="passwordToggle" type="button" aria-label="Show password" aria-pressed="false">
                    <img class="eye-open" src="assets/itemimage/1226.png" alt="Show password" width="20" height="20" style="image-rendering:pixelated">
                    <img class="eye-closed hidden" src="assets/itemimage/290.png" alt="Hide password" width="20" height="20" style="image-rendering:pixelated">
                </button>
            </div>
            <p class="caps-warning" id="capsLockWarning"><img src="assets/itemimage/1182.png" alt="" width="14" height="14" style="image-rendering:pixelated;vertical-align:-2px"> CAPS LOCK AKTIF</p>

            <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>

            <button class="button button-primary button-wide" id="loginButton" type="submit">
                <span class="btn-label">SIGN IN</span>
                <span>↗</span>
            </button>
        </form>

        <div class="demo-note">
            <span class="status-dot"></span> LIVE MODE <span class="demo-divider">•</span> GROWERA Player Server
        </div>
    </div>

    <footer class="site-footer">GROWERA © <span id="year"></span> CRYSTAL ERA</footer>
</section>

</main>

<div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

<script type="module" src="js/login.js"></script>
</body>
</html>
