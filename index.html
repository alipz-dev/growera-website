<!DOCTYPE html><html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GROWERA | Login</title><style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-family: Arial, sans-serif;
        color: #eaf8ff;
        background:
            radial-gradient(circle at top, #163d64, transparent 55%),
            #07111f;
    }

    .login-box {
        width: 100%;
        max-width: 390px;
        padding: 32px;
        border: 1px solid #245477;
        border-radius: 18px;
        background: rgba(9, 24, 42, 0.95);
        box-shadow: 0 0 45px #00c8ff12;
    }

    .logo {
        margin: 0 0 8px;
        text-align: center;
        font-size: 32px;
        font-weight: 900;
        letter-spacing: 4px;
        color: #70eaff;
    }

    .subtitle {
        margin: 0 0 28px;
        text-align: center;
        color: #8ca9bf;
        font-size: 13px;
    }

    label {
        display: block;
        margin: 16px 0 8px;
        font-size: 13px;
        color: #b9d7e9;
    }

    input {
        width: 100%;
        padding: 13px;
        border: 1px solid #284b65;
        border-radius: 9px;
        outline: none;
        color: white;
        background: #0b1a2b;
        font-size: 14px;
    }

    input:focus {
        border-color: #54dfff;
    }

    button {
        width: 100%;
        margin-top: 22px;
        padding: 14px;
        border: 0;
        border-radius: 9px;
        color: #04131e;
        background: linear-gradient(90deg, #79efff, #39b9ff);
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
    }

    button:disabled {
        opacity: 0.6;
        cursor: wait;
    }

    #message {
        min-height: 20px;
        margin-top: 18px;
        text-align: center;
        font-size: 13px;
        line-height: 1.6;
        overflow-wrap: anywhere;
    }

    .footer {
        margin-top: 22px;
        text-align: center;
        color: #66859c;
        font-size: 11px;
    }
</style>

</head><body>
    <main class="login-box">
        <h1 class="logo">GROWERA</h1>
        <p class="subtitle">Crystal Era • Account Login Test</p>    <form id="loginForm">
        <label for="username">Username</label>
        <input
            id="username"
            type="text"
            placeholder="Masukkan username"
            autocomplete="username"
            required
        >

        <label for="password">Password</label>
        <input
            id="password"
            type="password"
            placeholder="Masukkan password"
            autocomplete="current-password"
            required
        >

        <button id="loginButton" type="submit">
            TEST LOGIN
        </button>
    </form>

    <div id="message" role="status">
        Siap menguji koneksi GROWERA.
    </div>

    <div class="footer">
        GROWERA • DEVELOPMENT TEST
    </div>
</main>

<script>
async function testGrowEra() {
    const output = document.getElementById("message");

    output.textContent = "Menguji koneksi jaringan...";
    output.style.color = "#70eaff";

    try {
        const response = await fetch(
            "https://api.gtps.cloud/g-api/18891/api/growera/status",
            {
                method: "GET",
                mode: "no-cors",
                cache: "no-store"
            }
        );

        output.textContent =
            "Permintaan selesai. Response type: " +
            response.type +
            ". HTTP status tidak dapat dibaca dalam mode no-cors.";

        output.style.color = "#58ffad";

    } catch (error) {
        output.textContent =
            "Permintaan gagal: " + error.message;

        output.style.color = "#ff8585";
    }
}

testGrowEra();
</script>

</body>
</html>
