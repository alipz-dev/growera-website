<!DOCTYPE html><html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07111f">
    <title>GROWERA | Login</title><style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-family: Arial, sans-serif;
        color: #eaf8ff;
        background:
            radial-gradient(circle at top, #163d64, transparent 55%),
            #07111f;
    }

    .login-box {
        width: 100%;
        max-width: 390px;
        padding: 32px;
        border: 1px solid #245477;
        border-radius: 18px;
        background: rgba(9, 24, 42, 0.95);
        box-shadow: 0 0 45px #00c8ff12;
    }

    .logo {
        margin: 0 0 8px;
        text-align: center;
        font-size: 32px;
        font-weight: 900;
        letter-spacing: 4px;
        color: #70eaff;
        text-shadow: 0 0 20px #00c8ff50;
    }

    .subtitle {
        margin: 0 0 28px;
        text-align: center;
        color: #8ca9bf;
        font-size: 13px;
    }

    label {
        display: block;
        margin: 16px 0 8px;
        font-size: 13px;
        color: #b9d7e9;
    }

    input {
        width: 100%;
        padding: 13px;
        border: 1px solid #284b65;
        border-radius: 9px;
        outline: none;
        color: white;
        background: #0b1a2b;
        font-size: 14px;
    }

    input:focus {
        border-color: #54dfff;
        box-shadow: 0 0 10px #54dfff18;
    }

    button {
        width: 100%;
        margin-top: 14px;
        padding: 14px;
        border: 0;
        border-radius: 9px;
        color: #04131e;
        background: linear-gradient(90deg, #79efff, #39b9ff);
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        transition: opacity 0.2s;
    }

    button:disabled {
        opacity: 0.6;
        cursor: wait;
    }

    button.secondary {
        color: #bdeeff;
        background: #102b42;
        border: 1px solid #245477;
    }

    #message,
    #loginTestResult {
        min-height: 20px;
        margin-top: 18px;
        text-align: center;
        font-size: 13px;
        line-height: 1.6;
        overflow-wrap: anywhere;
    }

    #loginTestResult {
        padding: 12px;
        border: 1px solid #203f57;
        border-radius: 9px;
        background: #061421;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-word;
    }

    .section-title {
        margin: 24px 0 8px;
        color: #70eaff;
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 1px;
    }

    .footer {
        margin-top: 22px;
        text-align: center;
        color: #66859c;
        font-size: 11px;
    }
</style>

</head><body>
    <main class="login-box">
        <h1 class="logo">GROWERA</h1>    <p class="subtitle">
        Crystal Era • Account Connection Test
    </p>

    <form id="loginForm">
        <label for="username">Username</label>
        <input
            id="username"
            name="username"
            type="text"
            placeholder="Masukkan username"
            autocomplete="username"
            maxlength="64"
            required
        >

        <label for="password">Password</label>
        <input
            id="password"
            name="password"
            type="password"
            placeholder="Masukkan password"
            autocomplete="current-password"
            maxlength="256"
            required
        >

        <button id="loginButton" type="submit">
            TEST LOGIN
        </button>
    </form>

    <div id="message" role="status" aria-live="polite">
        Memeriksa koneksi GROWERA...
    </div>

    <div class="section-title">API CONNECTION</div>

    <button
        id="connectionButton"
        class="secondary"
        type="button"
    >
        TEST CONNECTION
    </button>

    <div class="section-title">LOGIN TEST RESULT</div>

    <pre id="loginTestResult">Belum ada tes login.</pre>

    <div class="footer">
        GROWERA • DEVELOPMENT TEST
    </div>
</main>

<script>
    const API_STATUS_URL = "/api/growera/status";
    const API_LOGIN_URL = "/api/growera/login";

    const form = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const connectionButton = document.getElementById("connectionButton");
    const message = document.getElementById("message");
    const loginTestResult = document.getElementById("loginTestResult");

    function showMessage(text, color = "#70eaff") {
        message.textContent = text;
        message.style.color = color;
    }

    async function readResponse(response) {
        const raw = await response.text();

        try {
            return {
                data: JSON.parse(raw),
                raw: raw
            };
        } catch {
            return {
                data: null,
                raw: raw
            };
        }
    }

    async function testConnection() {
        connectionButton.disabled = true;
        connectionButton.textContent = "CHECKING...";

        showMessage("Menghubungkan ke API...", "#70eaff");

        try {
            const response = await fetch(API_STATUS_URL, {
                method: "GET",
                headers: {
                    "Accept": "application/json"
                },
                cache: "no-store"
            });

            const result = await readResponse(response);

            if (!response.ok) {
                throw new Error(
                    "HTTP " + response.status + ": " + result.raw
                );
            }

            if (!result.data || result.data.success !== true) {
                throw new Error(
                    result.data?.message || "Respons API tidak valid."
                );
            }

            showMessage(
                "API GROWERA terhubung! " +
                (result.data.message || ""),
                "#58ffad"
            );

        } catch (error) {
            console.error("[GROWERA STATUS ERROR]", error);

            showMessage(
                "Koneksi API gagal: " + error.message,
                "#ff8585"
            );

        } finally {
            connectionButton.disabled = false;
            connectionButton.textContent = "TEST CONNECTION";
        }
    }

    async function testGrowEraLogin(username, password) {
        const response = await fetch(API_LOGIN_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({
                username: username,
                password: password
            }),
            cache: "no-store"
        });

        const result = await readResponse(response);

        return {
            status: response.status,
            data: result.data,
            raw: result.raw
        };
    }

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        if (!username || !password) {
            showMessage(
                "Username dan password wajib diisi.",
                "#ff8585"
            );
            return;
        }

        loginButton.disabled = true;
        loginButton.textContent = "TESTING LOGIN...";

        loginTestResult.textContent = "Sedang mengirim request login...";
        showMessage("Memeriksa kredensial akun...", "#70eaff");

        try {
            const result = await testGrowEraLogin(username, password);

            loginTestResult.textContent =
                "HTTP Status: " + result.status +
                "\n\nResponse:\n" +
                (result.raw || "(Respons kosong)");

            if (result.status >= 200 && result.status < 300 &&
                result.data?.success === true) {

                showMessage(
                    "Login berhasil diverifikasi oleh API.",
                    "#58ffad"
                );

            } else if (result.status === 401) {
                showMessage(
                    "Login gagal. Username atau password tidak cocok.",
                    "#ff8585"
                );

            } else {
                showMessage(
                    "Tes selesai, tetapi login belum berhasil. Periksa hasil tes di bawah.",
                    "#ffd479"
                );
            }

        } catch (error) {
            console.error("[GROWERA LOGIN ERROR]", error);

            loginTestResult.textContent =
                "Request gagal:\n" + error.message;

            showMessage(
                "Gagal menghubungi endpoint login.",
                "#ff8585"
            );

        } finally {
            loginButton.disabled = false;
            loginButton.textContent = "TEST LOGIN";
        }
    });

    connectionButton.addEventListener("click", testConnection);

    // Cek koneksi status saat halaman pertama kali dibuka.
    testConnection();
</script>

</body>
</html>
