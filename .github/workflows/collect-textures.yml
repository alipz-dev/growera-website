name: Collect Growtopia Item Textures
on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "IDs per run (1-500; recommended 250)"
        required: true
        default: "250"
        type: string
      reset_progress:
        description: "Start from the beginning; existing images stay"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "23 18 * * 0"
permissions:
  contents: write
concurrency:
  group: growera-texture-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Refresh item ID list
        run: node scripts/sync-item-ids.mjs
      - name: Download batch
        env:
          BATCH_SIZE: ${{ inputs.batch_size || '250' }}
          RESET_PROGRESS: ${{ inputs.reset_progress || 'false' }}
          CONCURRENCY: "3"
          REQUEST_DELAY_MS: "150"
          MAX_RETRIES: "3"
          GT_SERVER_ID: "1791"
        run: node scripts/texture-collector.mjs
      - name: Commit textures and progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/items data/item-ids.txt data/texture-progress.json data/texture-failures-last-run.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: collect Growtopia item textures"
          git pull --rebase origin main
          git push origin HEAD:main
